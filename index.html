<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sandalia e-Fattura — Fatturazione elettronica</title>
<meta name="author" content="Squintu Massimiliano">
<meta name="copyright" content="© 2026 Squintu Massimiliano — Tutti i diritti riservati">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>:root{
  --navy:#0d2238;--navy2:#132f4c;--navy3:#1b3d61;--teal:#0f9d8a;--teal2:#0b7d6e;--teal-l:#e3f5f2;
  --gold:#c9a24a;--bg:#f3f5f8;--card:#fff;--line:#e2e7ee;--line2:#cfd7e2;--txt:#14202e;--mut:#5d6b7c;--mut2:#8a97a8;
  --red:#c8353b;--red-l:#fdecec;--amber:#b7791f;--amber-l:#fdf4e2;--green:#1f8a4c;--green-l:#e6f5ec;--blue:#2266c4;--blue-l:#e8f0fc;
  --r:10px;--sh:0 1px 2px rgba(13,34,56,.06),0 4px 14px rgba(13,34,56,.06);
  --f:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.45 var(--f);color:var(--txt);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--teal2)}
.mono{font-family:var(--mono);font-size:12.5px}
/* layout */
#app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
#side{background:linear-gradient(180deg,var(--navy) 0%,#0a1b2d 100%);color:#c9d6e6;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
.brand{padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,.07)}
.brand .logo{display:flex;align-items:center;gap:10px}
.brand .mark{width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,var(--teal),#2bc4ad);display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;letter-spacing:-.5px;box-shadow:0 4px 12px rgba(15,157,138,.35)}
.brand b{color:#fff;font-size:15.5px;letter-spacing:-.2px;display:block;line-height:1.1}
.brand small{font-size:11px;color:#8ea3bb;letter-spacing:.3px}
.nav{padding:10px 10px 20px;flex:1}
.nav h6{margin:16px 10px 6px;font-size:10.5px;text-transform:uppercase;letter-spacing:1.1px;color:#6f86a1;font-weight:700}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:#c9d6e6;text-decoration:none;font-weight:500;cursor:pointer;font-size:13.5px}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a.on{background:rgba(15,157,138,.18);color:#fff;box-shadow:inset 3px 0 0 var(--teal)}
.nav a svg{width:17px;height:17px;flex:none;opacity:.85}
.nav .cnt{margin-left:auto;background:var(--teal);color:#fff;font-size:11px;border-radius:10px;padding:1px 7px;font-weight:700}
.side-foot{padding:12px 16px;font-size:10.5px;color:#6f86a1;border-top:1px solid rgba(255,255,255,.07);line-height:1.5}
#main{min-width:0;display:flex;flex-direction:column}
#top{height:58px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 22px;position:sticky;top:0;z-index:20}
#top .az{display:flex;align-items:center;gap:8px}
#top select{border:1px solid var(--line2);border-radius:8px;padding:7px 10px;background:#fff;font-weight:600;max-width:340px}
.grow{flex:1}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
.b-grey{background:#eef1f5;color:#4a5869}.b-blue{background:var(--blue-l);color:var(--blue)}.b-green{background:var(--green-l);color:var(--green)}
.b-red{background:var(--red-l);color:var(--red)}.b-amber{background:var(--amber-l);color:var(--amber)}.b-teal{background:var(--teal-l);color:var(--teal2)}.b-navy{background:var(--navy);color:#fff}
#view{padding:22px 26px 40px;max-width:1500px;width:100%}
.ph{display:flex;align-items:flex-end;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.ph h1{margin:0;font-size:22px;letter-spacing:-.4px}
.ph p{margin:3px 0 0;color:var(--mut);font-size:13px}
.ph .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:16px}
.card>.hd{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
.card>.hd h3{margin:0;font-size:14.5px;letter-spacing:-.1px}
.card>.hd .acts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.card>.bd{padding:16px}
.card>.bd.p0{padding:0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.span2{grid-column:span 2}.span3{grid-column:span 3}.span4{grid-column:span 4}.spanall{grid-column:1/-1}
.kpi{padding:15px 16px;position:relative;overflow:hidden}
.kpi .l{font-size:11.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--mut);font-weight:700}
.kpi .v{font-size:24px;font-weight:800;letter-spacing:-.6px;margin-top:4px}
.kpi .s{font-size:12px;color:var(--mut);margin-top:2px}
.kpi:after{content:'';position:absolute;right:-18px;top:-18px;width:70px;height:70px;border-radius:50%;background:var(--teal-l);opacity:.7}
.kpi.warn:after{background:var(--amber-l)}.kpi.bad:after{background:var(--red-l)}.kpi.info:after{background:var(--blue-l)}
/* forms */
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f>label{font-size:11.5px;font-weight:700;color:var(--mut);letter-spacing:.2px}
.f>label .req{color:var(--red)}
.f input,.f select,.f textarea,.inp{border:1px solid var(--line2);border-radius:8px;padding:8px 10px;background:#fff;width:100%;min-width:0;outline:none;transition:border .15s,box-shadow .15s}
.f input:focus,.f select:focus,.f textarea:focus,.inp:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(15,157,138,.14)}
.f textarea{min-height:70px;resize:vertical}
.f .hint{font-size:11.5px;color:var(--mut2)}
.f.bad input,.f.bad select{border-color:var(--red);background:#fffafa}
.f .ok{color:var(--green);font-size:11.5px}.f .ko{color:var(--red);font-size:11.5px}
.chk{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--teal)}
.sec-t{font-size:12px;text-transform:uppercase;letter-spacing:.9px;font-weight:800;color:var(--navy3);margin:18px 0 10px;display:flex;align-items:center;gap:8px}
.sec-t:after{content:'';flex:1;height:1px;background:var(--line)}
.sec-t:first-child{margin-top:0}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:#fff;border-radius:8px;padding:8px 13px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;transition:all .15s;color:var(--txt)}
.btn:hover{border-color:var(--navy3);background:#f8fafc}
.btn svg{width:15px;height:15px}
.btn.pri{background:var(--teal);border-color:var(--teal);color:#fff}.btn.pri:hover{background:var(--teal2)}
.btn.dark{background:var(--navy);border-color:var(--navy);color:#fff}.btn.dark:hover{background:var(--navy3)}
.btn.dang{color:var(--red);border-color:#efc3c5}.btn.dang:hover{background:var(--red-l)}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:7px}
.btn.ghost{border-color:transparent;background:transparent}.btn.ghost:hover{background:#eef2f6}
.btn:disabled{opacity:.45;cursor:not-allowed}
.ibtn{border:none;background:transparent;cursor:pointer;padding:5px;border-radius:6px;color:var(--mut);display:inline-grid;place-items:center}
.ibtn:hover{background:#eef2f6;color:var(--txt)}.ibtn svg{width:16px;height:16px}
/* tables */
.tw{overflow:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);font-weight:800;padding:10px 12px;background:#f8fafc;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;z-index:1}
table.t td{padding:9px 12px;border-bottom:1px solid #edf0f4;vertical-align:middle}
table.t tr:hover td{background:#fafcfd}
table.t tr.sel td{background:#eef8f6}
table.t .r,.r{text-align:right}.c{text-align:center}
table.t td.nw,.nw{white-space:nowrap}
table.t tfoot td{font-weight:800;background:#f8fafc;border-top:1px solid var(--line)}
.clk{cursor:pointer}
.empty{padding:40px 20px;text-align:center;color:var(--mut)}
.empty svg{width:42px;height:42px;opacity:.35;margin-bottom:8px}
.toolbar{display:flex;gap:8px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.toolbar .inp{width:auto}
.toolbar .search{min-width:240px;flex:1;max-width:380px}
.bulk{display:flex;gap:8px;align-items:center;padding:8px 16px;background:var(--teal-l);border-bottom:1px solid #c5e8e2;font-weight:700;font-size:13px}
.pager{display:flex;align-items:center;gap:8px;padding:10px 16px;justify-content:flex-end;font-size:12.5px;color:var(--mut)}
.pager .btn{padding:5px 10px}
/* righe fattura */
.righe{min-width:940px;table-layout:fixed}.righe td{padding:5px 6px;vertical-align:top}
.righe input,.righe select{border:1px solid transparent;border-radius:6px;padding:6px 7px;width:100%;background:transparent}
.righe input:hover,.righe select:hover{border-color:var(--line2)}
.righe input:focus,.righe select:focus{border-color:var(--teal);background:#fff;outline:none}
.righe tr.adv td{background:#fbfcfd}
.righe .num{text-align:right}
/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 12px;overflow:auto;background:#fff;border-radius:var(--r) var(--r) 0 0}
.tabs button{border:none;background:transparent;padding:12px 14px;font-weight:700;color:var(--mut);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;font-size:13px}
.tabs button.on{color:var(--teal2);border-bottom-color:var(--teal)}
.tabs button .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);margin-left:5px;vertical-align:middle}
/* editor layout */
.ed{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
.ed .aside{position:sticky;top:74px}
.tot-row{display:flex;justify-content:space-between;padding:5px 0;font-size:13px}
.tot-row.big{font-size:17px;font-weight:800;border-top:1px solid var(--line);margin-top:6px;padding-top:10px}
.tot-row span:last-child{font-variant-numeric:tabular-nums;font-weight:700}
.msg{display:flex;gap:8px;padding:8px 10px;border-radius:8px;font-size:12.5px;margin-bottom:6px;align-items:flex-start}
.msg.err{background:var(--red-l);color:#8c1d22}.msg.warn{background:var(--amber-l);color:#7a4e0d}.msg.ok{background:var(--green-l);color:#14603a}.msg.info{background:var(--blue-l);color:#174a91}
.msg>svg{width:16px;height:16px;flex:none;margin-top:1px}
.msg code{font-family:var(--mono);font-weight:700;font-size:11.5px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(10,24,40,.48);display:flex;align-items:flex-start;justify-content:center;z-index:100;padding:40px 16px;overflow:auto;backdrop-filter:blur(2px)}
.mo{background:#fff;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.25);width:100%;max-width:720px;animation:pop .16s ease-out}
.mo.wide{max-width:1100px}.mo.sm{max-width:460px}
.mo>.hd{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.mo>.hd h3{margin:0;font-size:16px}
.mo>.bd{padding:18px 20px;max-height:calc(100vh - 220px);overflow:auto}
.mo>.ft{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);background:#fafbfc;border-radius:0 0 14px 14px}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
#toasts{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:200}
.toast{background:var(--navy);color:#fff;padding:11px 16px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.2);font-weight:600;max-width:420px;animation:pop .2s}
.toast.err{background:var(--red)}.toast.ok{background:var(--green)}
/* autocomplete */
.ac{position:relative}
.ac-list{position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid var(--line2);border-radius:8px;box-shadow:var(--sh);z-index:30;max-height:260px;overflow:auto;margin-top:2px}
.ac-list div{padding:8px 10px;cursor:pointer;font-size:13px;border-bottom:1px solid #f1f3f6}
.ac-list div:hover,.ac-list div.on{background:var(--teal-l)}
.ac-list small{color:var(--mut)}
/* dropzone */
.drop{border:2px dashed var(--line2);border-radius:12px;padding:34px 20px;text-align:center;color:var(--mut);transition:all .15s;cursor:pointer;background:#fbfcfd}
.drop.on,.drop:hover{border-color:var(--teal);background:var(--teal-l);color:var(--teal2)}
.drop svg{width:40px;height:40px;margin-bottom:8px}
.drop b{color:var(--txt);display:block;font-size:15px;margin-bottom:4px}
/* timeline */
.tl{position:relative;padding-left:20px}
.tl:before{content:'';position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl .it{position:relative;margin-bottom:12px}
.tl .it:before{content:'';position:absolute;left:-19px;top:4px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--teal)}
.tl .it.red:before{border-color:var(--red)}.tl .it.amber:before{border-color:var(--amber)}
.tl .it b{font-size:13px}.tl .it small{display:block;color:var(--mut)}
/* chart */
.chart{display:flex;align-items:flex-end;gap:8px;height:180px;padding:10px 4px 0}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.chart .bars{display:flex;gap:3px;align-items:flex-end;height:100%;width:100%;justify-content:center}
.chart .bar{width:42%;border-radius:4px 4px 0 0;background:var(--teal);min-height:2px;transition:height .3s}
.chart .bar.b2{background:#9fb3c8}
.chart .lbl{font-size:10.5px;color:var(--mut);font-weight:700}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mut);font-weight:600}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* anteprima fattura */
.inv{font-family:var(--f);color:#111;background:#fff;padding:28px 32px;font-size:12px;border:1px solid var(--line);border-radius:8px}
.inv h2{font-size:20px;margin:0;letter-spacing:-.3px;color:var(--navy)}
.inv .ihd{display:flex;justify-content:space-between;gap:20px;border-bottom:3px solid var(--teal);padding-bottom:14px;margin-bottom:14px}
.inv .parti{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:14px}
.inv .box{border:1px solid #d9dfe7;border-radius:6px;padding:10px 12px}
.inv .box h5{margin:0 0 5px;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--teal2)}
.inv table{width:100%;border-collapse:collapse;margin-bottom:12px}
.inv th{background:#f0f4f8;font-size:10px;text-transform:uppercase;letter-spacing:.5px;padding:6px;text-align:left;border-bottom:1px solid #cfd7e2}
.inv td{padding:6px;border-bottom:1px solid #eceff3;vertical-align:top}
.inv .tt{margin-left:auto;width:320px}
.inv .tt td{border:none;padding:3px 6px}
.inv .tt tr.g td{font-weight:800;font-size:14px;border-top:2px solid var(--navy)}
.inv .foot{font-size:10px;color:#666;border-top:1px solid #ddd;padding-top:8px;margin-top:14px}
pre.xml{background:#0d1b2a;color:#cfe3f5;padding:14px;border-radius:8px;overflow:auto;max-height:520px;font:12px/1.5 var(--mono);white-space:pre}
.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,var(--navy),#0b4f57)}
.login .box{background:#fff;border-radius:16px;padding:34px;width:400px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.kv{display:grid;grid-template-columns:170px 1fr;gap:6px 12px;font-size:13px}.kv dt{color:var(--mut);font-weight:600}.kv dd{margin:0}
.pill-row{display:flex;gap:6px;flex-wrap:wrap}
.help{font-size:12.5px;color:var(--mut);line-height:1.55}
.help h4{color:var(--txt);margin:14px 0 4px;font-size:13.5px}
.guide h3{margin:22px 0 8px;color:var(--navy);font-size:16px}.guide p,.guide li{line-height:1.6;color:#2c3a4a}
@media (max-width:1100px){.ed{grid-template-columns:1fr}.ed .aside{position:static}.g4,.g6{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:820px){#app{grid-template-columns:1fr}#side{position:fixed;left:-260px;width:248px;z-index:90;transition:left .2s}#side.open{left:0}.g2,.g3,.g4,.g6{grid-template-columns:1fr}.span2,.span3,.span4{grid-column:auto}#view{padding:16px}.menu-btn{display:inline-grid!important}}
.menu-btn{display:none}
@media print{
  body{background:#fff}#side,#top,#toasts,.ov .hd,.ov .ft,.noprint{display:none!important}
  .ov{position:static;background:none;padding:0;backdrop-filter:none}.mo{box-shadow:none;max-width:none}.mo>.bd{max-height:none;padding:0;overflow:visible}
  #app.printing #view{display:none}.inv{border:none;padding:0}
}
</style>
</head>

X.nomeFile = f => `${((f.trasmittente || {}).paese || 'IT').toUpperCase()}${U.trim((f.trasmittente || {}).codice).toUpperCase()}_${f.progressivo || '00001'}.xml`;

/* ---------------- Controlli formali (in stile SDI) ---------------- */
X.valida = (f, ctx = {}) => {
  const E = [], add = (codice, msg, livello = 'errore') => E.push({ codice, msg: msg || T.ERRORI_SDI[codice] || '', livello });
  const t = U.calcola(f), ced = f.cedente || {}, ces = f.cessionario || {}, tr = f.trasmittente || {};
  const semp = T.TD_SEMPLIFICATA.includes(f.tipoDoc);

  if (!U.trim(tr.codice)) add('00300', 'Manca l\'identificativo fiscale del soggetto trasmittente (Impostazioni azienda → Trasmissione).');
  else if ((tr.paese || 'IT') === 'IT' && !U.checkCF(tr.codice) && !U.checkPIVA(tr.codice)) add('00300');
  // Cedente
  const pc = (ced.paese || 'IT').toUpperCase();
  if (!U.trim(ced.piva)) add('00301', 'Manca la partita IVA del cedente/prestatore.');
  else if (pc === 'IT' && !U.checkPIVA(ced.piva)) add('00301');
  if (U.trim(ced.cf) && pc === 'IT' && !U.checkCF(ced.cf)) add('00301', 'Codice fiscale del cedente/prestatore formalmente errato.');
  if (!U.trim(ced.denominazione) && !(U.trim(ced.nome) && U.trim(ced.cognome))) add('', 'Indicare la denominazione oppure nome e cognome del cedente/prestatore.');
  if (!ced.sede || !U.trim(ced.sede.indirizzo) || !U.trim(ced.sede.comune)) add('', 'Sede del cedente/prestatore incompleta (indirizzo, CAP, comune).');
  if (['TD17', 'TD18', 'TD19'].includes(f.tipoDoc) && pc === 'IT') add('00473');
  if (f.tipoDoc === 'TD18' && !U.isUE(pc)) add('', 'TD18: il cedente deve essere un soggetto di uno Stato membro UE.');
  if (f.tipoDoc === 'TD28' && pc !== 'SM') add('', 'TD28: il cedente deve essere un operatore di San Marino (IdPaese SM).');
  // Cessionario
  const pz = (ces.paese || (ces.sede && ces.sede.nazione) || 'IT').toUpperCase();
  if (!U.trim(ces.piva) && !U.trim(ces.cf) && pz === 'IT') add('00417');
  if (U.trim(ces.piva) && pz === 'IT' && !U.checkPIVA(ces.piva)) add('00305');
  if (U.trim(ces.cf) && pz === 'IT' && !U.checkCF(ces.cf)) add('00306');
  if (ces.gruppoIva && !U.trim(ces.piva) && U.trim(ces.cf) && ces.cfGruppo && U.trim(ces.cf) === U.trim(ces.cfGruppo)) add('00327');
  if (!semp && (!ces.sede || !U.trim(ces.sede.indirizzo) || !U.trim(ces.sede.comune))) add('', 'Sede del cessionario/committente incompleta.');
  const stesso = U.trim(ced.piva) && U.trim(ced.piva) === U.trim(ces.piva) && pc === pz;
  if (stesso && !T.TD_CEDENTE_UGUALE.includes(f.tipoDoc) && !['TD26'].includes(f.tipoDoc)) add('00471');
  if (T.TD_CEDENTE_UGUALE.includes(f.tipoDoc) && !stesso) add('', `${f.tipoDoc}: cedente e cessionario devono coincidere.`);
  if (f.tipoDoc === 'TD29' && pc !== 'IT') add('', 'TD29: il cedente deve essere un soggetto italiano.');
  // Trasmissione
  const cd = X.codiceDestinatario(f);
  if (!semp && f.formato === 'FPA12' && cd.length !== 6) add('00427', 'Fattura PA: il codice univoco ufficio (IPA) deve avere 6 caratteri.');
  if (f.formato !== 'FPA12' && cd.length !== 7) add('00427', 'Fattura B2B/B2C: il codice destinatario deve avere 7 caratteri.');
  if (!/^[A-Z0-9]{6,7}$/.test(cd)) add('00311');
  if (U.trim(f.codiceDestinatario) && U.trim(f.codiceDestinatario) !== '0000000' && U.trim(ces.pec) && f.forzaPec) add('00426');
  // Documento
  if (!f.data) add('', 'Data del documento obbligatoria.');
  if (!U.trim(f.numero)) add('', 'Numero del documento obbligatorio.');
  else if (!/\d/.test(f.numero)) add('00425');
  if (f.data && f.data > U.oggi() && !T.TD_INTEGRAZIONE.includes(f.tipoDoc)) add('', 'La data del documento è successiva alla data odierna: lo SDI scarta le fatture con data futura (00403).', 'errore');

    if (!al && !r.natura) add('00400', n + T.ERRORI_SDI['00400']);
    if (al && r.natura) add('00401', n + T.ERRORI_SDI['00401']);
    if (T.NATURE_GENERICHE.includes(r.natura)) add('00445', n + T.ERRORI_SDI['00445']);
    if (/^N6/.test(r.natura) && (r.esigibilita || f.esigibilita) === 'S') add('00420', n + T.ERRORI_SDI['00420']);
    (r.sconti || []).forEach(s => { if (!U.num(s.percentuale) && !U.num(s.importo)) add('00437', n + T.ERRORI_SDI['00437']); });
    if (U.trim(r.quantita) !== '' && U.num(r.quantita) < 0) add('', n + 'la quantità non può essere negativa (usare prezzo negativo o tipo sconto/abbuono).');
  });
  (f.casse || []).forEach((c, i) => {
    if (!U.num(c.aliquotaIVA) && !c.natura) add('00413');
    if (U.num(c.aliquotaIVA) && c.natura) add('00414');
    if (c.ritenuta && !(f.ritenute || []).length) add('00415');

  if ((f.righe || []).some(r => r.ritenuta) && !(f.ritenute || []).length) add('00411');
  (f.ritenute || []).forEach(r => { if (!r.causale) add('', `Ritenuta ${r.tipo}: causale di pagamento obbligatoria.`); if (!U.num(r.aliquota)) add('', `Ritenuta ${r.tipo}: aliquota obbligatoria.`); });

  if (ced.regime === 'RF20' && (f.righe || []).some(r => U.num(r.aliquota))) add('', 'Regime di franchigia transfrontaliera (RF20): le operazioni sono fatturate senza IVA.', 'avviso');

  if (semp && t.totale > 400) add('', 'Fattura semplificata: il totale non può superare 400 € (art. 21-bis DPR 633/72).');
  if (f.formato === 'FPA12' && !(dc.ordini || []).concat(dc.contratti || [], dc.convenzioni || []).some(d => U.trim(d.cig) || U.trim(d.cup)) ) add('', 'Fattura PA: verificare se è richiesto il CIG/CUP (art. 25 DL 66/2014).', 'avviso');
  if (f.formato === 'FPA12' && ces.splitPayment && (f.righe || []).some(r => U.num(r.aliquota)) && f.esigibilita !== 'S') add('', 'Il committente è soggetto a scissione dei pagamenti: impostare l\'esigibilità S.', 'avviso');
  if (ces.dichiarazioneIntento && U.trim(ces.dichiarazioneIntento.protocollo) && !(f.righe || []).some(r => r.natura === 'N3.5')) add('', 'Il cliente ha una dichiarazione d\'intento: verificare l\'uso della natura N3.5.', 'avviso');
  if ((f.righe || []).some(r => r.natura === 'N3.5') && !(f.righe || []).some(r => (r.altriDati || []).some(a => a.tipo === 'INTENTO'))) add('', 'Natura N3.5: indicare in Altri dati gestionali TipoDato "INTENTO" con protocollo di ricezione e data della dichiarazione d\'intento.');
  // Pagamento
  ((f.pagamento || {}).dettagli || []).forEach(d => { if (U.trim(d.iban) && !U.checkIBAN(d.iban)) add('', `IBAN ${d.iban} non valido.`); });
  if (ctx.numeriEsistenti && ctx.numeriEsistenti.includes(String(f.numero).toUpperCase())) add('', `Numero ${f.numero} già utilizzato nell'anno: lo SDI segnalerebbe un file duplicato (00404).`);

/* ---------------- Lettura fatture ricevute ---------------- */
X.kids = (n, name) => n ? Array.from(n.childNodes || []).filter(c => c.nodeType === 1 && (c.localName || c.nodeName.split(':').pop()) === name) : [];

X.parseXml = text => {
  const doc = new DOMParser().parseFromString(text, 'application/xml');

X.totaliLetti = f => {

  t.riepiloghi = f.riepiloghiLetti; t.imponibile = U.r2(f.riepiloghiLetti.reduce((s, r) => s + r.imponibile, 0)); t.imposta = U.r2(f.riepiloghiLetti.reduce((s, r) => s + r.imposta, 0));

/* ---------------- Notifiche SDI (formato messaggi SDI v1.0) ---------------- */
X.NS_MSG = 'http://ivaservizi.agenziaentrate.gov.it/docs/xsd/fatture/messaggi/v1.0';
X.notifica = (tipo, d) => {
  const ts = new Date().toISOString().replace(/\.\d+Z$/, '+00:00');
  const radice = { RC: 'RicevutaConsegna', NS: 'RicevutaScarto', MC: 'NotificaMancataConsegna', NE: 'NotificaEsito', DT: 'NotificaDecorrenzaTermini', AT: 'AttestazioneTrasmissioneFattura' }[tipo];
  let corpo = `  <IdentificativoSdI>${d.idSdi}</IdentificativoSdI>\n  <NomeFile>${X.x(d.nomeFile)}</NomeFile>\n`;
  if (d.hash) corpo += `  <Hash>${d.hash}</Hash>\n`;
  corpo += `  <DataOraRicezione>${ts}</DataOraRicezione>\n`;
  if (tipo === 'RC') corpo += `  <DataOraConsegna>${ts}</DataOraConsegna>\n  <Destinatario>\n    <Codice>${X.x(d.codiceDestinatario)}</Codice>\n    <Descrizione>${X.x(d.descrizione || '')}</Descrizione>\n  </Destinatario>\n`;
  if (tipo === 'NS') corpo += '  <ListaErrori>\n' + d.errori.map(e => `    <Errore>\n      <Codice>${e.codice || '00200'}</Codice>\n      <Descrizione>${X.x(e.msg)}</Descrizione>\n    </Errore>`).join('\n') + '\n  </ListaErrori>\n';
  if (tipo === 'MC' || tipo === 'AT') corpo += `  <Descrizione>${X.x(d.descrizione || 'Impossibilità di recapito: file messo a disposizione nell\'area riservata del destinatario.')}</Descrizione>\n`;
  if (tipo === 'NE') corpo += `  <EsitoCommittente>\n    <IdentificativoSdI>${d.idSdi}</IdentificativoSdI>\n    <Esito>${d.esito}</Esito>\n    <Descrizione>${X.x(d.descrizione || '')}</Descrizione>\n  </EsitoCommittente>\n`;
  if (tipo === 'DT') corpo += `  <Descrizione>Decorsi i termini di 15 giorni senza esito del committente.</Descrizione>\n`;
  corpo += `  <MessageId>${Math.floor(Math.random() * 9e9)}</MessageId>\n`;
  return `<?xml version="1.0" encoding="UTF-8"?>\n<types:${radice} xmlns:types="${X.NS_MSG}" xmlns:ds="http://www.w3.org/2000/09/xmldsig#" versione="1.0">\n${corpo}</types:${radice}>\n`;
};
// Indice del pacchetto di versamento (struttura ispirata a UNI 11386 SInCRO)
X.indicePacchetto = (az, pacchetto, docs) => {
  const r = [`<?xml version="1.0" encoding="UTF-8"?>`, `<IndiceVersamento xmlns="urn:sandalia:efattura:pdv:1.0" versione="1.0">`,
    `  <Produttore><Denominazione>${X.x(az.denominazione)}</Denominazione><PartitaIVA>${X.x(az.piva || '')}</PartitaIVA><CodiceFiscale>${X.x(az.cf || '')}</CodiceFiscale></Produttore>`,
    `  <Pacchetto><Identificativo>${pacchetto.id}</Identificativo><DataCreazione>${new Date().toISOString()}</DataCreazione><Anno>${pacchetto.anno}</Anno><Conservatore>${X.x(pacchetto.conservatore || '')}</Conservatore><Sistema>Sandalia e-Fattura</Sistema><Titolare>Squintu Massimiliano</Titolare></Pacchetto>`,
    `  <Documenti numero="${docs.length}">`];
  for (const d of docs) r.push(`    <Documento><NomeFile>${X.x(d.nomeFile)}</NomeFile><Impronta algoritmo="SHA-256">${d.hash}</Impronta><Tipologia>${d.direzione === 'E' ? 'Fattura emessa' : 'Fattura ricevuta'}</Tipologia><TipoDocumento>${d.tipoDoc}</TipoDocumento><Numero>${X.x(d.numero)}</Numero><Data>${d.data}</Data><Controparte>${X.x(d.controparte)}</Controparte><PartitaIVAControparte>${X.x(d.pivaControparte || '')}</PartitaIVAControparte><IdentificativoSdI>${X.x(d.idSdi || '')}</IdentificativoSdI></Documento>`);

      for (;;) {

    if (!o.id) o.id = U.uid();

        if (error) throw error; a[a.length - 1].id = data; o.id = data;

  },

  async del(c, id) {

  async setSistema(k, v) { const a = this.cache.sistema; const i = a.findIndex(x => x.id === k); if (i >= 0) a[i].v = v; else a.push({ id: k, v }); await this.idbSet('sistema', a); },

  async ripristina(o) { for (const c of this.COLLS) if (Array.isArray(o[c])) { this.cache[c] = o[c]; await this.persistLocal(c); } }

      <div id="main"><header id="top"><button class="ibtn menu-btn" id="mnu">${ic('menu')}</button><div class="az">${ic('bld')}<select id="az-sel"></select><button class="btn sm ghost" id="az-new" title="Nuova azienda">${ic('plus')}</button></div>
      <span class="grow"></span><span id="top-badges" class="pill-row"></span></header><section id="view"></section></div></div>`;
    $$('.nav a').forEach(a => a.onclick = () => { this.go(a.dataset.v); $('#side').classList.remove('open'); });
    $('#mnu').onclick = () => $('#side').classList.toggle('open');
    $('#az-sel').onchange = async e => { this.S.az = e.target.value; await DB.setSistema('ultima-azienda', this.S.az); if (DB.mode === 'supabase') await DB.loadAzienda(this.S.az); this.go('dashboard'); };
    $('#az-new').onclick = () => this.go('benvenuto');
    this.refreshTop();
  },
  refreshTop() {
    const sel = $('#az-sel'); if (!sel) return;
    const az = DB.list('aziende');
    sel.innerHTML = az.length ? az.map(a => `<option value="${a.id}" ${a.id === this.S.az ? 'selected' : ''}>${U.esc(a.denominazione || 'Azienda')}${a.piva ? ' · ' + a.piva : ''}</option>`).join('') : '<option>Nessuna azienda</option>';
    const canale = App.canaleAzienda ? App.canaleAzienda(this.az()) : DB.sistema('canale', 'SIMULATORE');
    $('#top-badges').innerHTML = `<span class="badge ${DB.mode === 'supabase' ? 'b-teal' : 'b-grey'}">${ic('shield')} ${DB.mode === 'supabase' ? 'Supabase · ' + U.esc(DB.user ? DB.user.email : '') : 'Archivio locale'}</span>
      <span class="badge ${canale === 'SIMULATORE' ? 'b-amber' : 'b-green'}">${ic('send')} SDI: ${canale === 'SIMULATORE' ? 'simulatore (test)' : canale === 'PEC' ? 'PEC aziendale' : canale}</span>`;
    if (this.S.az) {
      const f = DB.list('fatture', this.S.az);
      const cnt = { emesse: f.filter(x => x.direzione === 'E' && ['BOZZA', 'DA_INVIARE', 'SCARTATA'].includes(x.stato)).length, ricevute: f.filter(x => x.direzione === 'R' && x.stato === 'RICEVUTA').length };
      Object.entries(cnt).forEach(([k, n]) => { const e = $(`[data-cnt="${k}"]`); if (e) { e.hidden = !n; e.textContent = n; } });
    }
  },
  VIEWS: {},
  go(v, p = {}) {
    if (!this.S.az && !['benvenuto', 'impostazioni', 'guida'].includes(v)) v = 'benvenuto';
    this.S.view = v; this.S.p = p;
    if (location.hash !== '#' + v && ['dashboard', 'nuova', 'emesse', 'ricevute', 'ricezione', 'integrazioni', 'soggetti', 'articoli', 'tabelle', 'scadenzario', 'registri', 'notifiche', 'conservazione', 'azienda', 'impostazioni', 'guida'].includes(v)) { try { history.replaceState(null, '', '#' + v); } catch (e) { } }
    $$('.nav a').forEach(a => a.classList.toggle('on', a.dataset.v === v || (v === 'editor' && a.dataset.v === 'nuova')));
    const el = $('#view'); el.innerHTML = ''; window.scrollTo(0, 0);
    try { (this.VIEWS[v] || this.VIEWS.dashboard).call(this, el, p); } catch (e) { console.error(e); el.innerHTML = `<div class="msg err">Errore nella vista: ${U.esc(e.message)}</div>`; }
    this.refreshTop();
  },
  ph(title, sub, acts = '') { return `<div class="ph"><div><h1>${title}</h1>${sub ? `<p>${sub}</p>` : ''}</div><div class="acts">${acts}</div></div>`; },

  /* ---------------- tabella con ricerca, selezione multipla e paginazione ---------------- */
  tabella(el, cfg) {
    // cfg: {righe, colonne:[{t,v:(r)=>html, cls, sort:(r)=>val}], cerca:(r)=>string, filtri:html, onFiltri, azioniMassive:[{l,fn,dang}], onRiga, perPagina, chiave, vuoto}
    const st = this._tst = this._tst || {}; const k = cfg.chiave || 'tab'; st[k] = st[k] || { q: '', pag: 0, sel: new Set(), sort: null, dir: 1 };
    const s = st[k], per = cfg.perPagina || 25;
    const draw = () => {
      let rows = cfg.righe();
      if (s.q) { const q = s.q.toLowerCase(); rows = rows.filter(r => (cfg.cerca ? cfg.cerca(r) : JSON.stringify(r)).toLowerCase().includes(q)); }
      if (s.sort != null && cfg.colonne[s.sort].sort) { const fn = cfg.colonne[s.sort].sort; rows = rows.slice().sort((a, b) => { const x = fn(a), y = fn(b); return (x > y ? 1 : x < y ? -1 : 0) * s.dir; }); }
      const pagine = Math.max(1, Math.ceil(rows.length / per)); if (s.pag >= pagine) s.pag = pagine - 1;
      const vis = rows.slice(s.pag * per, s.pag * per + per);
      s.sel = new Set([...s.sel].filter(id => rows.some(r => r.id === id)));
      const am = cfg.azioniMassive || [];
      el.innerHTML = `<div class="toolbar"><input class="inp search" placeholder="Cerca…" value="${U.esc(s.q)}">${cfg.filtri || ''}<span class="grow"></span><span class="help">${rows.length} elementi</span></div>
        ${am.length && s.sel.size ? `<div class="bulk">${s.sel.size} selezionati ${am.map((a, i) => `<button class="btn sm ${a.dang ? 'dang' : ''}" data-am="${i}">${a.l}</button>`).join('')}<button class="btn sm ghost" data-desel>Deseleziona</button></div>` : ''}
        <div class="tw"><table class="t"><thead><tr>${am.length ? '<th style="width:34px"><input type="checkbox" data-all></th>' : ''}${cfg.colonne.map((c, i) => `<th class="${c.cls || ''} ${c.sort ? 'clk' : ''}" data-sort="${i}">${c.t}${s.sort === i ? (s.dir > 0 ? ' ▲' : ' ▼') : ''}</th>`).join('')}</tr></thead>
        <tbody>${vis.map(r => `<tr data-id="${r.id}" class="${s.sel.has(r.id) ? 'sel' : ''} ${cfg.onRiga ? 'clk' : ''}">${am.length ? `<td><input type="checkbox" data-ck="${r.id}" ${s.sel.has(r.id) ? 'checked' : ''}></td>` : ''}${cfg.colonne.map(c => `<td class="${c.cls || ''}">${c.v(r)}</td>`).join('')}</tr>`).join('')}</tbody>
        ${cfg.piede ? `<tfoot>${cfg.piede(rows)}</tfoot>` : ''}</table>${!rows.length ? `<div class="empty">${ic('file')}<div>${cfg.vuoto || 'Nessun elemento'}</div></div>` : ''}</div>
        <div class="pager"><button class="btn sm" data-pg="-1" ${s.pag <= 0 ? 'disabled' : ''}>${ic('left')}</button><span>Pagina ${s.pag + 1} di ${pagine}</span><button class="btn sm" data-pg="1" ${s.pag >= pagine - 1 ? 'disabled' : ''}>${ic('right')}</button></div>`;
      const inp = $('.search', el); inp.oninput = U.debounce(() => { s.q = inp.value; s.pag = 0; draw(); const n = $('.search', el); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }, 250);
      $$('[data-pg]', el).forEach(b => b.onclick = () => { s.pag += +b.dataset.pg; draw(); });
      $$('[data-sort]', el).forEach(th => th.onclick = () => { const i = +th.dataset.sort; if (!cfg.colonne[i].sort) return; if (s.sort === i) s.dir *= -1; else { s.sort = i; s.dir = 1; } draw(); });
      $$('[data-ck]', el).forEach(c => { c.onclick = e => e.stopPropagation(); c.onchange = () => { c.checked ? s.sel.add(c.dataset.ck) : s.sel.delete(c.dataset.ck); draw(); }; });
      const all = $('[data-all]', el); if (all) { all.checked = vis.length && vis.every(r => s.sel.has(r.id)); all.onchange = () => { vis.forEach(r => all.checked ? s.sel.add(r.id) : s.sel.delete(r.id)); draw(); }; }
      $$('[data-am]', el).forEach(b => b.onclick = async () => { await am[+b.dataset.am].fn([...s.sel]); s.sel.clear(); draw(); this.refreshTop(); });
      const ds = $('[data-desel]', el); if (ds) ds.onclick = () => { s.sel.clear(); draw(); };
      if (cfg.onRiga) $$('tbody tr', el).forEach(tr => tr.onclick = e => { if (e.target.closest('button,input,a,select')) return; cfg.onRiga(tr.dataset.id); });
      if (cfg.dopo) cfg.dopo(el);
      if (cfg.onFiltri) cfg.onFiltri(el, draw);
    };
    draw(); return draw;
  }
};

App.VIEWS.dashboard = function (el) {
  const az = this.az(), anno = new Date().getFullYear(), F = DB.list('fatture', az.id);
  const segno = f => T.TD_NOTE_CREDITO.includes(f.tipoDoc) ? -1 : 1;
  const emAnno = F.filter(f => f.direzione === 'E' && (f.data || '').startsWith(anno) && !['BOZZA', 'SCARTATA', 'DA_INVIARE'].includes(f.stato) && !T.TD_INTEGRAZIONE.includes(f.tipoDoc) && !T.TD_CEDENTE_UGUALE.includes(f.tipoDoc));
  const riAnno = F.filter(f => f.direzione === 'R' && (f.data || '').startsWith(anno));
  const sum = (a, k) => U.r2(a.reduce((s, f) => s + segno(f) * ((f.totali || {})[k] || 0), 0));
  const bozze = F.filter(f => f.direzione === 'E' && ['BOZZA', 'DA_INVIARE'].includes(f.stato)), scartate = F.filter(f => f.stato === 'SCARTATA'), daReg = F.filter(f => f.direzione === 'R' && f.stato === 'RICEVUTA');
  const oggi = U.oggi(), tra30 = U.addGiorni(oggi, 30);
  const scad = F.flatMap(f => ((f.pagamento || {}).dettagli || []).filter(d => d.scadenza && !d.pagato && !['BOZZA', 'SCARTATA'].includes(f.stato)).map(d => ({ f, d }))).filter(x => x.d.scadenza <= tra30);
  const mesi = Array.from({ length: 12 }, (_, i) => i);
  const perMese = (arr, m) => arr.filter(f => +f.data.slice(5, 7) === m + 1).reduce((s, f) => s + segno(f) * ((f.totali || {}).imponibile || 0), 0);
  const vE = mesi.map(m => perMese(emAnno, m)), vR = mesi.map(m => perMese(riAnno, m)), mx = Math.max(1, ...vE, ...vR);
  const nomiM = ['Gen', 'Feb', 'Mar', 'Apr', 'Mag', 'Giu', 'Lug', 'Ago', 'Set', 'Ott', 'Nov', 'Dic'];
  const notif = DB.list('notifiche', az.id).sort((a, b) => (b.dataOra || '').localeCompare(a.dataOra || '')).slice(0, 7);
  const arch = DB.list('archivio', az.id), termAnno = anno - 1, termine = `${anno + 1}-01-31`;
  const nonCons = arch.filter(a => a.anno === termAnno && !['VERSATO', 'CONSERVATO'].includes(a.stato)).length;
  el.innerHTML = this.ph(U.esc(az.denominazione), `P.IVA ${U.esc(az.piva || '—')} · ${U.lab(T.REGIMI, az.regime)} · Anno ${anno}`, `<button class="btn" data-go="ricezione">${ic('up')} Importa fatture</button><button class="btn pri" data-go="nuova">${ic('plus')} Nuova fattura</button>`) + `
    ${!az.sede || !U.trim(az.sede.indirizzo) || !U.trim((az.trasmissione || {}).codice) ? `<div class="msg warn">${ic('bld')}<div>Completa i <b>dati dell'azienda</b> (sede, trasmissione, IBAN) prima di emettere fatture. <a href="#" data-go="azienda">Vai ai dati azienda</a></div></div>` : ''}
    <div class="grid g4">
      <div class="card kpi"><div class="l">Fatturato ${anno}</div><div class="v">${U.eurS(sum(emAnno, 'imponibile'))}</div><div class="s">${emAnno.length} documenti · IVA ${U.eurS(sum(emAnno, 'imposta'))}</div></div>
      <div class="card kpi info"><div class="l">Acquisti ${anno}</div><div class="v">${U.eurS(sum(riAnno, 'imponibile'))}</div><div class="s">${riAnno.length} fatture ricevute · IVA ${U.eurS(sum(riAnno, 'imposta'))}</div></div>
      <div class="card kpi ${bozze.length || scartate.length ? 'warn' : ''}"><div class="l">Da trasmettere</div><div class="v">${bozze.length}</div><div class="s">${scartate.length ? `<span style="color:var(--red);font-weight:700">${scartate.length} scartate da correggere</span>` : 'nessuno scarto'}</div></div>
      <div class="card kpi ${daReg.length ? 'info' : ''}"><div class="l">Ricevute da registrare</div><div class="v">${daReg.length}</div><div class="s">${scad.length} scadenze nei prossimi 30 giorni</div></div>
    </div>
    <div class="grid" style="grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)">
      <div class="card"><div class="hd"><h3>Andamento mensile ${anno} (imponibile)</h3><div class="acts legend"><span><i style="background:var(--teal)"></i>Vendite</span><span><i style="background:#9fb3c8"></i>Acquisti</span></div></div><div class="bd">
        <div class="chart">${mesi.map(m => `<div class="col" title="${nomiM[m]}: vendite ${U.eurS(vE[m])} · acquisti ${U.eurS(vR[m])}"><div class="bars"><div class="bar" style="height:${vE[m] / mx * 100}%"></div><div class="bar b2" style="height:${vR[m] / mx * 100}%"></div></div><div class="lbl">${nomiM[m]}</div></div>`).join('')}</div></div></div>
      <div class="card"><div class="hd"><h3>Ultime notifiche SDI</h3><div class="acts"><button class="btn sm ghost" data-go="notifiche">Tutte</button></div></div><div class="bd">
        ${notif.length ? `<div class="tl">${notif.map(n => { const f = DB.get('fatture', n.fatturaId); return `<div class="it ${n.tipo === 'NS' ? 'red' : n.tipo === 'MC' ? 'amber' : ''}"><b>${n.tipo} · ${T.NOTIFICHE[n.tipo] || ''}</b><small>${f ? 'Fattura ' + U.esc(f.numero) + ' · ' + U.esc(f.controparteNome || '') : U.esc(n.nomeFile || '')} — ${new Date(n.dataOra).toLocaleString('it-IT')}</small></div>`; }).join('')}</div>` : '<div class="help">Nessuna notifica ricevuta.</div>'}</div></div>
    </div>

      <div class="card"><div class="hd"><h3>Promemoria normativi</h3></div><div class="bd help">
        <div class="msg info">${ic('cal')}<div>${T.TERMINI.emissione}</div></div>
        <div class="msg ${nonCons ? 'warn' : 'ok'}">${ic('arch')}<div>Conservazione fatture ${termAnno}: termine <b>${U.dataIt(termine)}</b>. ${nonCons ? `<b>${nonCons}</b> documenti ancora da versare al conservatore.` : 'Nessun documento in sospeso.'}</div></div>
        <div class="msg info">${ic('repeat')}<div>${T.TERMINI.integrazione}</div></div>
        <div class="msg info">${ic('x')}<div>${T.TERMINI.scartoRinvio}</div></div></div></div>
    </div>`;
  $$('[data-go]', el).forEach(b => b.onclick = e => { e.preventDefault(); this.go(b.dataset.go); });
};

App.inviaSDI = async function (f, o = {}) {

  const canale = App.canaleAzienda(az);
  if (err.length && (!o.forza || canale !== 'SIMULATORE')) {
    if (o.silenzioso) { this.toast(`${f.numero}: ${err.length} errori, non inviata`, 'err'); return false; }

      const m = this.modal('Il documento contiene errori', `<p>Lo SDI scarterebbe il file per i seguenti motivi:</p>${err.map(e => `<div class="msg err">${e.codice ? `<code>${e.codice}</code>` : ''}<div>${U.esc(e.msg)}</div></div>`).join('')}`,
        `<button class="btn" data-a="no">Correggi</button>${canale === 'SIMULATORE' ? '<button class="btn dang" data-a="si">Invia comunque al simulatore</button>' : ''}`);
      $$('[data-a]', m.el).forEach(b => b.onclick = () => { m.close(); res(b.dataset.a); });
      $$('[data-x]', m.el).forEach(b => b.addEventListener('click', () => res('no')));
    });
    if (scelta !== 'si') return false;
  }
  if (canale === 'PEC' && f.stato === 'DA_INVIARE' && f.progressivo && f.xml && f.sdi && f.sdi.nomeFile && X.build(f) === f.xml) return this.inviaPEC(f, az, o);
  az.contatoreInvii = (az.contatoreInvii || 0) + 1; await DB.put('aziende', az);
  f.progressivo = U.progressivo(az.contatoreInvii);
  f.xml = X.build(f); const nomeFile = X.nomeFile(f); const hash = await U.sha256(f.xml);
  f.sdi = { nomeFile, hash, dataInvio: new Date().toISOString(), canale, idSdi: String(Math.floor(1e9 + Math.random() * 8.99e9)) };
  f.stato = 'INVIATA'; const t = U.calcola(f); f.totali = { imponibile: t.imponibile, imposta: t.imposta, totale: t.totale, nettoAPagare: t.nettoAPagare, ritenute: t.totRitenute };
  if (canale !== 'SIMULATORE') f.sdi.idSdi = '';
  if (canale === 'PEC') return this.inviaPEC(f, az, o);
  if (canale !== 'SIMULATORE') {
    if (DB.mode !== 'supabase') { this.toast('Il canale reale richiede il collegamento a Supabase e le Edge Functions', 'err'); f.stato = 'DA_INVIARE'; await DB.put('fatture', f); return false; }
    try {
      const { data: s } = await DB.sb.auth.getSession();
      const r = await fetch(`${DB.cfg.supabaseUrl}/functions/v1/sdi-trasmetti`, { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + (s.session ? s.session.access_token : DB.cfg.supabaseKey) }, body: JSON.stringify({ aziendaId: az.id, fatturaId: f.id, nomeFile, xmlBase64: U.b64enc(U.utf8(f.xml)) }) });
      const j = await r.json(); if (!r.ok) throw new Error(j.errore || r.statusText);
      f.sdi.idSdi = j.identificativoSdI || f.sdi.idSdi; await DB.put('fatture', f); this.toast('File trasmesso allo SDI: in attesa delle notifiche', 'ok'); return true;
    } catch (e) { f.stato = 'DA_INVIARE'; await DB.put('fatture', f); this.toast('Trasmissione non riuscita: ' + e.message, 'err'); return false; }
  }
  await DB.put('fatture', f); this.log('Invio SDI', f.numero);
  // Simulatore: esito realistico in base ai controlli e al recapito
  const modo = DB.sistema('sim-esito', 'AUTO'); const cd = X.codiceDestinatario(f);

App.importaFile = async function (bytes, nome, canale, out, op = {}) {
  const az = this.az(); const low = nome.toLowerCase();
  if (low.endsWith('.zip') || (bytes[0] === 0x50 && bytes[1] === 0x4B)) { for (const e of await U.unzip(bytes)) { try { await this.importaFile(e.data, e.name.split('/').pop(), canale, out, op); } catch (er) { out.err.push(e.name + ': ' + er.message); } } return; }
  let xml, p7m = false;
  const head = new TextDecoder('latin1').decode(bytes.subarray(0, 100)).replace(/^﻿|^ï»¿/, '').trim();
  if (low.endsWith('.p7m') || !head.startsWith('<')) { xml = U.p7mToXml(bytes); p7m = true; } else xml = U.decodeText(bytes);
  const doc = X.parseXml(xml), rn = doc.documentElement.localName || doc.documentElement.nodeName.split(':').pop();
  if (rn === 'FileMetadati') { out.metadati = out.metadati || []; out.metadati.push({ idSdi: X.v(doc.documentElement, 'IdentificativoSdI'), nomeFile: X.v(doc.documentElement, 'NomeFile') }); out.meta++; return; }
  if (['RicevutaConsegna', 'RicevutaScarto', 'NotificaMancataConsegna', 'NotificaEsito', 'NotificaDecorrenzaTermini', 'AttestazioneTrasmissioneFattura', 'NotificaScarto'].includes(rn)) {
    const nf = X.v(doc.documentElement, 'NomeFile'), ids = X.v(doc.documentElement, 'IdentificativoSdI');
    const f = DB.list('fatture', az.id).find(x => x.direzione === 'E' && x.sdi && (x.sdi.nomeFile === nf || x.sdi.idSdi === ids));
    if (!f) { out.err.push(nome + ': notifica di un file non presente (' + nf + ')'); return; }
    const tipo = { RicevutaConsegna: 'RC', RicevutaScarto: 'NS', NotificaScarto: 'NS', NotificaMancataConsegna: 'MC', NotificaEsito: 'NE', NotificaDecorrenzaTermini: 'DT', AttestazioneTrasmissioneFattura: 'AT' }[rn];
    f.sdi.idSdi = ids || f.sdi.idSdi;
    const errori = X.qa(doc.documentElement, 'ListaErrori/Errore').map(e => ({ codice: X.v(e, 'Codice'), msg: X.v(e, 'Descrizione') }));
    await this.registraNotifica(f, tipo, { idSdi: f.sdi.idSdi, nomeFile: f.sdi.nomeFile, esito: X.v(doc.documentElement, 'EsitoCommittente/Esito') || X.v(doc.documentElement, 'Esito'), errori });
    const n = DB.list('notifiche', az.id).filter(x => x.fatturaId === f.id).pop(); if (n) { n.xml = xml; n.nomeFile = nome; await DB.put('notifiche', n); }
    out.notif++; return;
  }
  const docs = X.leggi(xml);
  const mio = p => p && ((U.trim(p.piva) && U.trim(p.piva).replace(/^IT/i, '') === U.trim(az.piva)) || (U.trim(p.cf) && U.trim(p.cf).toUpperCase() === U.trim(az.cf).toUpperCase()));
  const idSdiNome = (nome.match(/_(\w{5})\./) || [])[1];
  for (const d of docs) {
    let dir;
    if (mio(d.cessionario) && T.TD_INTEGRAZIONE.concat(T.TD_CEDENTE_UGUALE).includes(d.tipoDoc)) dir = 'E';
    else if (mio(d.cessionario)) dir = 'R'; else if (mio(d.cedente)) dir = 'E';
    else { out.extra.push(`${nome}: la fattura n. ${d.numero} non è intestata a ${az.denominazione} (cedente ${this.nomeSogg(d.cedente)}, cessionario ${this.nomeSogg(d.cessionario)}). Non importata.`); continue; }
    if (dir === 'E' && op.emesse === false) { out.extra.push(`${nome}: fattura emessa n. ${d.numero} ignorata (import emesse disattivato).`); continue; }
    const ctrp = dir === 'R' || T.TD_INTEGRAZIONE.includes(d.tipoDoc) ? d.cedente : d.cessionario;
    const piva = ctrp.piva || ctrp.cf || '';
    if (DB.list('fatture', az.id).some(x => x.direzione === dir && x.contropartePiva === piva && String(x.numero) === String(d.numero) && x.data === d.data && x.tipoDoc === d.tipoDoc)) { out.dup.push(d.numero); continue; }
    const t = X.totaliLetti(d);
    const f = Object.assign(d, {
      aziendaId: az.id, direzione: dir, stato: dir === 'R' ? 'RICEVUTA' : 'CONSEGNATA', xml, canale, controparteNome: this.nomeSogg(ctrp), contropartePiva: piva,
      nomeFileOriginale: nome, fileOriginale: p7m && bytes.length < 6e6 ? U.b64enc(bytes) : undefined, dataRicezione: new Date().toISOString(),
      sdi: { nomeFile: nome.replace(/\.p7m$/i, ''), idSdi: '', hash: await U.sha256(bytes), canale }, totali: { imponibile: t.imponibile, imposta: t.imposta, totale: t.totale, nettoAPagare: t.nettoAPagare, ritenute: t.totRitenute }, importata: true

App.VIEWS.registri = function (el) {
  const az = this.az(); const P = this._preg = this._preg || { anno: String(new Date().getFullYear()), per: 'T' + Math.ceil((new Date().getMonth() + 1) / 3), credito: '' };
  const anni = [...new Set(DB.list('fatture', az.id).map(f => (f.data || '').slice(0, 4)).filter(Boolean).concat([P.anno]))].sort().reverse();
  const periodi = [['A', 'Intero anno']].concat(['T1', 'T2', 'T3', 'T4'].map(t => [t, t[1] + '° trimestre'])).concat(['Gennaio', 'Febbraio', 'Marzo', 'Aprile', 'Maggio', 'Giugno', 'Luglio', 'Agosto', 'Settembre', 'Ottobre', 'Novembre', 'Dicembre'].map((m, i) => ['M' + (i + 1), m]));
  const inPer = d => { if (!d || !d.startsWith(P.anno)) return false; const m = +d.slice(5, 7); if (P.per === 'A') return true; if (P.per[0] === 'T') return Math.ceil(m / 3) === +P.per[1]; return m === +P.per.slice(1); };
  const F = DB.list('fatture', az.id).filter(f => !['BOZZA', 'SCARTATA', 'DA_INVIARE'].includes(f.stato) && f.tipoDoc !== 'TD29');
  const doppia = ['TD16', 'TD17', 'TD18', 'TD19', 'TD20', 'TD22', 'TD23', 'TD28'];
  const tot = f => f.direzione === 'R' ? X.totaliLetti(f) : U.calcola(f);
  const vend = F.filter(f => f.direzione === 'E' && inPer(f.data)), acq = F.filter(f => (f.direzione === 'R' && inPer(f.data)) || (f.direzione === 'E' && doppia.includes(f.tipoDoc) && inPer(f.data)));
  const riep = (arr, lato) => { const m = new Map(); let debito = 0, split = 0, diff = 0, nd = 0; arr.forEach(f => { const s = T.TD_NOTE_CREDITO.includes(f.tipoDoc) ? -1 : 1; tot(f).riepiloghi.forEach(r => { const k = r.aliquota ? r.aliquota + '%' : r.natura; const e = m.get(k) || { k, imp: 0, iva: 0 }; e.imp += s * r.imponibile; e.iva += s * r.imposta; m.set(k, e); if (r.esigibilita === 'S' && lato === 'V') split += s * r.imposta; else if (r.esigibilita === 'D') diff += s * r.imposta; else debito += s * r.imposta; if (lato === 'A' && /^N6/.test(r.natura)) nd += 0; }); }); return { righe: [...m.values()].sort((a, b) => b.iva - a.iva), iva: U.r2(debito), split: U.r2(split), diff: U.r2(diff) }; };
  const RV = riep(vend, 'V'), RA = riep(acq, 'A');
  const saldo = U.r2(RV.iva - RA.iva - U.num(P.credito));

  el.innerHTML = this.ph('Registri e liquidazione IVA', 'Riepilogo di controllo per periodo: la registrazione definitiva avviene in contabilità', `<button class="btn" id="rg-csv">${ic('dl')} Esporta registri CSV</button>`) + `
    <div class="card"><div class="bd" style="display:flex;gap:10px;align-items:end;flex-wrap:wrap"><div class="f"><label>Anno</label><select class="inp" data-p="anno">${optsL(anni.map(a => [a, a]), P.anno)}</select></div><div class="f"><label>Periodo</label><select class="inp" data-p="per">${optsL(periodi, P.per)}</select></div><div class="f"><label>Credito IVA periodo precedente</label><input class="inp" data-p="credito" value="${U.esc(P.credito)}" style="width:150px"></div></div></div>
    <div class="grid g4"><div class="card kpi"><div class="l">IVA a debito</div><div class="v">${U.eurS(RV.iva)}</div><div class="s">${vend.length} documenti in vendita</div></div><div class="card kpi info"><div class="l">IVA a credito</div><div class="v">${U.eurS(RA.iva)}</div><div class="s">${acq.length} documenti in acquisto</div></div>
      <div class="card kpi ${saldo > 0 ? 'warn' : ''}"><div class="l">${saldo >= 0 ? 'IVA da versare' : 'Credito IVA'}</div><div class="v">${U.eurS(Math.abs(saldo))}</div><div class="s">${az.regime === 'RF19' ? 'Regime forfettario: nessuna liquidazione' : 'Debito − credito − credito precedente'}</div></div>

    <div class="card"><div class="hd"><h3>Registro vendite</h3></div><div class="bd p0 tw">${tab(vend, 'V')}</div></div>
    <div class="card"><div class="hd"><h3>Registro acquisti (incluse le integrazioni TD16-TD19, TD20, TD22, TD23, TD28)</h3></div><div class="bd p0 tw">${tab(acq, 'A')}</div></div>
    <div class="msg info">${ic('book')}<div>Le integrazioni e autofatture (TD16-TD19, TD20, TD22, TD23, TD28) sono annotate sia nel registro vendite sia in quello acquisti (doppia annotazione); le fatture ricevute con natura N6.x non generano IVA a credito finché non è emessa l'integrazione TD16. L'IVA in split payment è versata dalla PA committente. La detraibilità è considerata piena: le eventuali limitazioni si gestiscono in contabilità.</div></div>`;

};

App.creaPacchetto = async function (ids) {

App.scaricaPacchetto = function (p) {

        <div class="sec-t">Informazioni</div><dl class="kv"><dt>Prodotto</dt><dd>Sandalia e-Fattura v${this.VERSIONE}</dd><dt>Titolare dei diritti</dt><dd><b>Squintu Massimiliano</b></dd><dt>Specifiche tecniche</dt><dd>FatturaPA 1.9.1 (in uso dal 15/05/2026), schema 1.2.3, semplificata 1.0</dd><dt>Diritti</dt><dd>© 2026 Squintu Massimiliano. Tutti i diritti riservati. Software proprietario concesso in licenza d'uso non esclusiva; vietate copia, modifica, decompilazione, distribuzione e cessione a terzi senza autorizzazione scritta del titolare.</dd></dl></div></div>
    </div>`;
  bind(el, cfg); bind(el, sys);

  const sl = $('#st-loc'); if (sl) sl.onclick = () => { DB.saveCfg({}); location.reload(); };
  const so = $('#st-out'); if (so) so.onclick = async () => { await DB.logout(); location.reload(); };
  $('#st-sdi').onclick = async () => { await DB.setSistema('canale', sys.canale); await DB.setSistema('sim-esito', sys.simEsito); await DB.setSistema('codice-piattaforma', U.trim(sys.codicePiattaforma).toUpperCase()); this.toast('Impostazioni SDI salvate', 'ok'); this.refreshTop(); };
  if (az) {
    const verLic = () => { const ok = az.licenza && az.licenza === U.licenza(az.piva, az.licenzaPiano, az.licenzaScadenza); const scad = az.licenzaScadenza && az.licenzaScadenza < U.oggi(); $('#st-lst').innerHTML = !az.licenza ? '<span class="badge b-amber">Versione di prova</span>' : !ok ? '<span class="badge b-red">Codice non valido</span>' : scad ? '<span class="badge b-red">Scaduta</span>' : '<span class="badge b-green">Attiva</span>'; };
    verLic();
    $('#st-lv').onclick = async () => { const c = U.trim($('#st-lc').value).toUpperCase(); const piani = ['TEST', 'BASE', 'PRO', 'STUDIO']; const tryScad = az.licenzaScadenza; const p = piani.find(pp => U.licenza(az.piva, pp, tryScad) === c); if (!p) return this.toast('Codice licenza non valido per questa partita IVA e scadenza. Indica la scadenza riportata nel contratto di licenza.', 'err'); az.licenza = c; az.licenzaPiano = p; await DB.put('aziende', az); this.toast('Licenza attivata', 'ok'); this.go('impostazioni'); };
    $('#st-gen').onclick = async () => {
      const pin = $('#st-gpin').value; const saved = DB.sistema('pin-titolare');
      if (!pin || pin.length < 6) return this.toast('Indica un PIN del titolare di almeno 6 caratteri', 'err');
      const h = await U.sha256('SFE-PIN|' + pin);
      if (!saved) { await DB.setSistema('pin-titolare', h); this.toast('PIN del titolare impostato su questo dispositivo', 'ok'); } else if (saved !== h) return this.toast('PIN non corretto', 'err');
      az.licenzaPiano = $('#st-gp').value; az.licenzaScadenza = $('#st-gs').value; az.licenza = U.licenza(az.piva, az.licenzaPiano, az.licenzaScadenza);
      await DB.put('aziende', az); this.toast('Licenza generata: ' + az.licenza, 'ok'); this.go('impostazioni');
    };
    const da = $('#st-delaz'); if (da) da.onclick = async () => { if (!await this.conferma(`Eliminare l'azienda <b>${U.esc(az.denominazione)}</b> e tutti i suoi dati (anagrafiche, fatture, archivio)? L'operazione non è reversibile: esegui prima un backup.`, 'Elimina definitivamente', true)) return; for (const c of ['soggetti', 'articoli', 'tabelle', 'fatture', 'notifiche', 'archivio', 'pacchetti']) for (const r of DB.list(c, az.id).slice()) await DB.del(c, r.id); await DB.del('aziende', az.id); this.S.az = (DB.list('aziende')[0] || {}).id || null; location.hash = ''; this.go(this.S.az ? 'dashboard' : 'benvenuto'); };
    if (DB.mode === 'supabase') {
      (async () => { const { data, error } = await DB.sb.from('membri').select('user_id, ruolo').eq('azienda_id', az.id); $('#st-mem').innerHTML = error ? U.esc(error.message) : (data || []).map(m => `<div>${U.esc(m.user_id === (DB.user || {}).id ? 'Tu' : m.user_id.slice(0, 8) + '…')} · <b>${U.esc(m.ruolo)}</b></div>`).join(''); })();

    }
  }
  $('#st-bk').onclick = async () => this.scarica(`backup_sandalia_efattura_${U.oggi()}.json`, JSON.stringify(await DB.backup()), 'application/json');
  $('#st-bkc').onclick = async () => this.copia(JSON.stringify(await DB.backup()));
  $('#st-rs').onclick = async () => { const [f] = await this.scegliFile('.json', false); if (!f) return; try { const o = JSON.parse(new TextDecoder().decode(await this.leggiFile(f))); if (!o.aziende) throw new Error('file non riconosciuto'); if (DB.mode === 'supabase') return this.toast('Il ripristino da file è disponibile in modalità locale', 'err'); if (!await this.conferma('Il ripristino sostituisce tutti i dati attuali. Procedere?', 'Ripristina', true)) return; await DB.ripristina(o); location.reload(); } catch (e) { this.toast('Ripristino non riuscito: ' + e.message, 'err'); } };
};

/* ---------------- Guida e normativa ---------------- */
App.VIEWS.guida = function (el) {
  el.innerHTML = this.ph('Guida e normativa', 'Come usare la piattaforma e riferimenti normativi essenziali') + `<div class="card"><div class="bd guide">
    <h3>1. Primi passi</h3><ol><li>Completa <b>Dati azienda</b>: sede, regime fiscale, REA o albo, IBAN e soggetto trasmittente (il codice fiscale che compone il nome del file).</li><li>Verifica i <b>sezionali</b> in Tabelle (numerazione distinta per vendite e autofatture, con anno o prefissi).</li><li>Inserisci clienti, fornitori e articoli, oppure importa un CSV o le fatture XML dal cassetto fiscale: le anagrafiche vengono create in automatico.</li><li>Emetti la prima fattura da <b>Nuova fattura</b>: il pannello "Controlli SDI" segnala in tempo reale gli errori che causerebbero lo scarto.</li></ol>
    <h3>2. Ciclo di vita della fattura emessa</h3><p>Bozza → Inviata allo SDI → <b>RC</b> ricevuta di consegna (fattura emessa e recapitata) oppure <b>MC</b> mancata consegna (emessa e disponibile nell'area riservata del cliente: va inviata una copia di cortesia) oppure <b>NS</b> scarto (fattura non emessa: correggere e ritrasmettere entro 5 giorni lavorativi con stesso numero e data). Per la PA: dopo la RC il committente ha 15 giorni per l'esito <b>NE</b> (EC01 accettazione, EC02 rifiuto), altrimenti lo SDI invia la <b>DT</b> decorrenza termini. Una fattura trasmessa non si modifica: si emette una nota di credito TD04.</p>
    <h3>3. Casistiche IVA</h3><ul><li><b>Aliquote</b> 22%, 10%, 5%, 4% (personalizzabili in Tabelle).</li><li><b>N1</b> escluse art. 15 (bolli, anticipazioni in nome e per conto) · <b>N2.1</b> non soggette artt. 7-7septies (servizi a committenti esteri) · <b>N2.2</b> non soggette altri casi (forfettari, minimi).</li><li><b>N3.1</b> esportazioni · <b>N3.2</b> cessioni intracomunitarie · <b>N3.3</b> verso San Marino · <b>N3.4</b> assimilate alle esportazioni · <b>N3.5</b> a seguito di dichiarazione d'intento (con TipoDato "INTENTO", protocollo e data) · <b>N3.6</b> altre non imponibili senza plafond.</li><li><b>N4</b> esenti art. 10 · <b>N5</b> regime del margine · <b>N6.1–N6.9</b> inversione contabile (rottami, oro, subappalto edile, fabbricati, cellulari, elettronica, comparto edile, energia, altri casi) · <b>N7</b> IVA assolta in altro Stato UE.</li><li><b>Esigibilità</b>: immediata, differita (IVA per cassa art. 32-bis DL 83/2012), scissione dei pagamenti (art. 17-ter, PA e soggetti obbligati).</li><li>Le nature generiche N2, N3 e N6 non sono più ammesse (scarto 00445).</li></ul>
    <h3>4. Operazioni con l'estero</h3><p><b>Fatture emesse</b> verso soggetti UE ed extra-UE: codice destinatario XXXXXXX, identificativo fiscale estero (per i privati extra-UE senza codice si usa 99999999999), CAP 00000 se non italiano. <b>Fatture ricevute</b> da fornitori esteri: si emette l'integrazione/autofattura TD17 (servizi), TD18 (beni intracomunitari) o TD19 (beni ex art. 17 c. 2) entro il 15 del mese successivo; dalle ricevute usa il pulsante "Integrazione". Acquisti da San Marino con IVA: TD28.</p>
    <h3>5. Professionisti e forfettari</h3><p>Ritenute RT01–RT06 con causale CU (A, M, Q, R, W, ecc.), anche su base ridotta (agenti: 50% o 20%). Casse TC01–TC22 con contributo integrativo soggetto a IVA; rivalsa INPS 4% come TC22. Regime forfettario RF19: operazioni con natura N2.2 e bollo virtuale di 2,00 € oltre 77,47 €. Nuovo regime di franchigia transfrontaliera RF20 (Direttiva UE 2020/285). Compensi sportivi esenti: dicitura <b>ESENZSPORT</b> negli Altri dati gestionali (specifiche 1.9.1).</p>
    <h3>6. Novità delle specifiche 1.9.1 (dal 15/05/2026)</h3><ul><li>Controllo <b>00327</b>: senza partita IVA del cessionario, il codice fiscale non può essere quello del Gruppo IVA ma della società partecipante.</li><li>Lavoratori sportivi: compensi esenti ex art. 36 c. 6 D.Lgs. 36/2021 indicati con ESENZSPORT.</li><li>Fino a 300 codici destinatario per i canali accreditati WS e SFTP; certificati del canale web service generati da file CSR.</li><li>Prodotti agroalimentari con Commissione unica nazionale: codice <b>CUN</b> in Altri dati gestionali (dal 16/05/2026, provv. 93628/2026). Verifica la dicitura esatta di TipoDato nel provvedimento.</li></ul>
    <h3>7. Ricezione delle fatture</h3><p><b>In automatico</b>: tramite il codice destinatario della piattaforma (canale SDICoop accreditato) o la PEC dell'azienda, registrati nel servizio "Registrazione dell'indirizzo telematico" di Fatture e Corrispettivi; le Edge Functions depositano i file nella casella e "Sincronizza" li importa. <b>A richiesta</b>: caricamento di XML, P7M e ZIP, anche dal download massivo del cassetto fiscale.</p>
    <h3>7-bis. Canale PEC (senza accreditamento)</h3><p>Ogni azienda può trasmettere e ricevere con la propria PEC. Il primo invio va all'indirizzo <b>sdi01@pec.fatturapa.it</b>; con la prima risposta lo SDI comunica l'indirizzo PEC personale (sdiNN@pec.fatturapa.it) da usare in seguito, da inserire in <b>Dati azienda → Canale SDI</b>. Il messaggio non deve superare 30 MB e ogni file 5 MB. Con Supabase il servizio <span class="mono">pec-servizio.mjs</span> spedisce le fatture in coda, legge ricevute e fatture passive e registra da solo l'indirizzo assegnato; in modalità locale l'invio è guidato e gli allegati di risposta dello SDI si caricano in <b>Ricezione e import</b>. Per ricevere le fatture passive sulla PEC, l'azienda la registra come indirizzo telematico nel portale Fatture e Corrispettivi.</p>
    <h3>8. Conservazione digitale</h3><p>Le fatture elettroniche si conservano in modalità elettronica (art. 39 DPR 633/72, DM 17/06/2014, Linee guida AgID) entro il terzo mese successivo al termine di presentazione della dichiarazione dei redditi. Sandalia e-Fattura tiene un archivio per azienda con impronte SHA-256 e prepara i pacchetti di versamento; la conservazione a norma è affidata al servizio gratuito dell'Agenzia delle Entrate o a un conservatore del Marketplace AgID.</p>
    <h3>9. Accreditamento al canale SDICoop (passaggio alla produzione)</h3><ol><li>Disporre di un server raggiungibile in HTTPS con mutua autenticazione (qui: Supabase Edge Functions o un servizio dedicato) e di un certificato di firma.</li><li>Presentare la richiesta di accreditamento del canale web service sul sito dedicato alla fatturazione elettronica dell'Agenzia delle Entrate, generando i certificati da file CSR.</li><li>Superare i test di interoperabilità (trasmissione e ricezione di file e notifiche).</li><li>Ottenere il codice destinatario (fino a 300 per canale) e impostarlo in Impostazioni → Canale SDI, passando dal simulatore a SDICoop.</li></ol>
    <h3>10. Diritti</h3><p>Sandalia e-Fattura è un software proprietario. © 2026 <b>Squintu Massimiliano</b> — Tutti i diritti riservati. L'uso da parte di altre aziende è subordinato a un contratto di licenza con il titolare. Le informazioni normative sono di supporto operativo e non sostituiscono la verifica professionale dei singoli casi.</p>
  </div></div>`;
};
